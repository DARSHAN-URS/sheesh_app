name: sheesh_app
description: "Sheesh — She always could. Hyperlocal artisan marketplace."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # ── UI / Design ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^3.0.0
  shimmer: ^3.0.0

  # ── State Management (Riverpod) ───────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Backend / Network ─────────────────────────────────────────
  dio: ^5.7.0
  supabase_flutter: ^2.8.4

  # ── Payments ──────────────────────────────────────────────────
  razorpay_flutter: ^1.3.7

  # ── Local Storage / Security ──────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ── Media / Files ─────────────────────────────────────────────
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── Utilities ─────────────────────────────────────────────────
  intl: ^0.20.3
  equatable: ^2.0.7
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  lottie: ^3.3.1

  # ── Notifications ─────────────────────────────────────────────
  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/creators/
    - assets/images/products/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/sheesh_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5A1629"
  adaptive_icon_foreground: "assets/images/sheesh_logo.png"
  web:
    generate: true
    image_path: "assets/images/sheesh_logo.png"
    background_color: "#5A1629"
    theme_color: "#D64438"
  windows:
    generate: true
    image_path: "assets/images/sheesh_logo.png"
    icon_size: 48
